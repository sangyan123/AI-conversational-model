server:
  port: 8080
  error:
    whitelabel:
      enabled: false  # 禁用 Whitelabel 错误页面
  cors:
    allowed-origins: "http://127.0.0.1:5500,http://localhost:5500"
    allowed-methods: "GET,POST,PUT,DELETE,OPTIONS"
    allowed-headers: "*"

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:your-api-key-here}
    url: "https://api.deepseek.com/v1/chat/completions"
    model: "deepseek-chat"
