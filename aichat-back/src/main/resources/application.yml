server:
  port: 8080
  error:
    whitelabel:
      enabled: false  # 禁用 Whitelabel 错误页面

deepseek:
  api:
    key: ${DEEPSEEK_API_KEY:your-api-key-here}
    url: "https://api.deepseek.com/v1/chat/completions"
    model: "deepseek-chat"
    # 单次请求的连接/读取超时（毫秒）
    connect-timeout-ms: 5000
    read-timeout-ms: 60000
    # 生成参数
    temperature: 0.7
    max-tokens: 2000
    system-prompt: "You are a helpful assistant."

# 可选：共享令牌鉴权。留空则不启用（本地开发开箱即用）。
# 配置后请求需带 Authorization: Bearer <token>
auth:
  token: ${AICHAT_AUTH_TOKEN:}

# 按 IP 限流，保护 DeepSeek 额度
ratelimit:
  enabled: true
  requests-per-window: 20
  window-ms: 60000
